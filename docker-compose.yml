services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-network

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - ecommerce-network

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: opensearch
    environment:
      - cluster.name=ecommerce-search
      - node.name=opensearch-node1
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - ecommerce-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --http-port=8080 --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - ecommerce-network

  # ============================================================
  # BACKEND — Go + Bun Microservices
  # ============================================================
  apisix:
    image: apache/apisix:3.15.0-debian
    container_name: apisix
    ports:
      - "9080:9080"   # client-facing proxy
      - "9091:9091"   # prometheus metrics
    environment:
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-changeme-ecommerce-client-secret}
    volumes:
      - ./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./deploy/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    image: ecommerce/auth-service:latest
    container_name: auth-service
    ports:
      - "8088:8088"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_SERVER_URL: ${KEYCLOAK_PUBLIC_SERVER_URL:-http://localhost:8080}
      SSO_BACKEND_CALLBACK_URL: http://localhost:8088/api/v1/auth/callback
      SSO_DEFAULT_FRONTEND_REDIRECT: http://localhost:3000/auth/callback
      SSO_ALLOWED_REDIRECT_URIS: http://localhost:3000/auth/callback,http://localhost:3001/auth/callback
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - ecommerce-network

  product-service:
    build:
      context: ./services
      dockerfile: product-service/Dockerfile
    image: ecommerce/product-service:latest
    container_name: product-service
    ports:
      - "8086:8086"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./services
      dockerfile: order-service/Dockerfile
    image: ecommerce/order-service:latest
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: ./services
      dockerfile: payment-service/Dockerfile
    image: ecommerce/payment-service:latest
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-network

  shipping-service:
    build:
      context: ./services
      dockerfile: shipping-service/Dockerfile
    image: ecommerce/shipping-service:latest
    container_name: shipping-service
    ports:
      - "8087:8087"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shippingservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  inventory-service:
    build:
      context: ./services
      dockerfile: inventory-service/Dockerfile
    image: ecommerce/inventory-service:latest
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventoryservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  rating-service:
    build:
      context: ./services/rating-service
      dockerfile: Dockerfile
    image: ecommerce/rating-service:latest
    container_name: rating-service
    ports:
      - "8089:8089"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ratingservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    image: ecommerce/media-service:latest
    container_name: media-service
    ports:
      - "8083:8083"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediaservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - ecommerce-network

  promotion-service:
    build:
      context: ./services/promotion-service
      dockerfile: Dockerfile
    image: ecommerce/promotion-service:latest
    container_name: promotion-service
    ports:
      - "8093:8093"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotionservice
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  search-service:
    build:
      context: ./services
      dockerfile: search-service/Dockerfile
    image: ecommerce/search-service:latest
    container_name: search-service
    ports:
      - "8094:8094"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
      KAFKA_SERVERS: kafka:9092
    depends_on:
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    image: ecommerce/notification-service:latest
    container_name: notification-service
    ports:
      - "8090:8090"
    environment:
      JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_SERVERS: kafka:9092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ============================================================
  # FRONTEND — SvelteKit 5 on Bun (SSR, httpOnly-cookie BFF auth)
  # ============================================================
  frontend:
    image: ghcr.io/ecommerce-int/frontend-web:latest
    pull_policy: always
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-to-gateway calls stay inside the compose network...
      API_INTERNAL_URL: http://apisix:9080
      # ...while the browser only needs the gateway for the SSO login redirect.
      API_PUBLIC_URL: http://localhost:9080
      # Plain-HTTP local access: tell SvelteKit the real public origin.
      ORIGIN: http://localhost:3000
    depends_on:
      apisix:
        condition: service_started
    networks:
      - ecommerce-network

  admin:
    image: ghcr.io/ecommerce-int/frontend-admin:latest
    pull_policy: always
    container_name: admin
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_INTERNAL_URL: http://apisix:9080
      API_PUBLIC_URL: http://localhost:9080
      ORIGIN: http://localhost:3001
    depends_on:
      apisix:
        condition: service_started
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  rustfs_data:
